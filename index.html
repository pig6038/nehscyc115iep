<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115 學年度第 1 學期 個別化教育計畫教育目標與評量</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }

        .a4-page {
            width: 21cm;
            min-height: 29.7cm;
            margin: 2rem auto;
            background: white;
            padding: 2cm;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: 2px solid #000;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
            vertical-align: top;
        }

        th {
            background-color: #f9fafb;
            font-weight: 500;
            text-align: center;
            width: 120px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 6px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            background-color: #f9fafb;
            transition: all 0.2s;
            font-family: inherit;
            font-size: 0.95rem;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 1cm;
            }
            
            body {
                background: white;
                margin: 0;
                padding: 0;
            }

            .a4-page {
                margin: 0;
                padding: 0;
                width: 100%;
                min-height: auto;
                box-shadow: none;
                border-radius: 0;
            }

            .print-hide {
                display: none !important;
            }

            /* 列印時移除輸入框和下拉選單的邊框、背景與箭頭，使其看起來像純文字 */
            input[type="text"], select, textarea {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
                appearance: none !important; /* 移除下拉箭頭 */
                -webkit-appearance: none !important;
                resize: none !important;
                color: #000 !important;
            }

            /* 確保表格框線在列印時清晰 */
            table, th, td {
                border-color: #000 !important;
            }
            
            th {
                background-color: #f3f4f6 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            /* 列印時隱藏尚未輸入的提示字(placeholder) */
            ::-webkit-input-placeholder { color: transparent !important; }
            :-moz-placeholder { color: transparent !important; }
            ::-moz-placeholder { color: transparent !important; }
            :-ms-input-placeholder { color: transparent !important; }
            ::placeholder { color: transparent !important; }
            
            /* 列印時如果下拉選單沒有選擇，隱藏預設文字 */
            .print-transparent {
                color: transparent !important;
            }
        }
    </style>
</head>
<body>

    <div class="a4-page relative">
        
        <!-- 標題 -->
        <h1 class="text-2xl font-bold text-center mb-6">115 學年度第 1 學期 個別化教育計畫教育目標與評量</h1>

        <!-- 表格開始 -->
        <table>
            <!-- 學生基本資料區段 -->
            <tr>
                <th>學生姓名</th>
                <td>
                    <select id="student_name" onchange="updateClass(this.value)">
                        <option value="" disabled selected>請選擇學生</option>
                        <option value="林崴樂">林崴樂</option>
                        <option value="黃博裕">黃博裕</option>
                        <option value="張錦鳳">張錦鳳</option>
                        <option value="陳岷宜">陳岷宜</option>
                    </select>
                </td>
                <th>就讀班級</th>
                <td><input type="text" id="student_class" placeholder="系統自動帶入" readonly></td>
            </tr>
            <tr>
                <th>科目名稱</th>
                <td><input type="text" placeholder="請輸入科目名稱"></td>
                <th>任課教師</th>
                <td><input type="text" placeholder="請輸入教師姓名"></td>
            </tr>
            <tr>
                <th>科目屬性</th>
                <td>
                    <select>
                        <option value="" disabled selected>請選擇...</option>
                        <option value="部定必修">部定必修</option>
                        <option value="校訂必修">校訂必修</option>
                        <option value="選修">選修</option>
                        <option value="特殊需求領域">特殊需求領域</option>
                        <option value="其他">其他</option>
                    </select>
                </td>
                <th>學分數</th>
                <td>
                    <select>
                        <option value="" disabled selected>請選擇...</option>
                        <option value="1">1 學分</option>
                        <option value="2">2 學分</option>
                        <option value="3">3 學分</option>
                        <option value="4">4 學分</option>
                        <option value="5">5 學分</option>
                        <option value="0">0 學分 (無學分)</option>
                    </select>
                </td>
            </tr>
            
            <!-- 教學調整 -->
            <tr>
                <th>教學調整</th>
                <td colspan="3">
                    <select class="mb-2">
                        <option value="" disabled selected>請選擇教學調整方式...</option>
                        <option value="不需調整">不需調整</option>
                        <option value="調整內容">調整內容</option>
                        <option value="歷程調整">歷程調整</option>
                        <option value="環境調整">環境調整</option>
                    </select>
                    <input type="text" placeholder="補充說明或其他調整細節...">
                </td>
            </tr>

            <!-- 1. 學年目標 -->
            <tr>
                <th colspan="4" class="text-left bg-gray-100 p-2 font-bold">1. 學年目標</th>
            </tr>
            <tr>
                <td colspan="4" class="p-0">
                    <textarea rows="6" class="w-full h-full p-2 border-0 rounded-none bg-transparent focus:ring-0" placeholder="請填寫本學年教育目標...&#10;(1)&#10;(2)&#10;(3)"></textarea>
                </td>
            </tr>

            <!-- 2. 學期目標與評量方式 -->
            <tr>
                <th colspan="4" class="text-left bg-gray-100 p-2 font-bold">2. 學期目標 與 評量方式</th>
            </tr>
            <tr>
                <th colspan="3" class="text-center">學期目標</th>
                <th colspan="1" class="text-center w-[200px]">評量方式</th>
            </tr>
            <!-- 產生 5 列輸入框 -->
            <script>
                const assessmentOptions = `
                    <option value="" disabled selected>請選擇...</option>
                    <option value="紙筆測驗">紙筆測驗</option>
                    <option value="口頭回答">口頭回答</option>
                    <option value="實作評量">實作評量</option>
                    <option value="觀察評量">觀察評量</option>
                    <option value="檔案評量">檔案評量</option>
                    <option value="其他">其他</option>
                `;
                for (let i = 1; i <= 5; i++) {
                    document.write(`
                        <tr>
                            <td colspan="3" class="p-1">
                                <input type="text" class="border-transparent focus:border-blue-500 bg-transparent hover:bg-gray-50" placeholder="目標 ${i}">
                            </td>
                            <td colspan="1" class="p-1">
                                <select class="border-transparent focus:border-blue-500 bg-transparent hover:bg-gray-50">
                                    ${assessmentOptions}
                                </select>
                            </td>
                        </tr>
                    `);
                }
            </script>

            <!-- 3. 評量標準(學業成績) -->
            <tr>
                <th colspan="4" class="text-left bg-gray-100 p-2 font-bold">3. 評量標準(學業成績)</th>
            </tr>
            <tr>
                <td colspan="4">
                    <select onchange="document.getElementById('eval_other').style.display = this.value === '其他方式' ? 'block' : 'none'">
                        <option value="" disabled selected>請選擇評量標準...</option>
                        <option value="依《高級中等以下學校特殊教育課程教材教法及評量實施辦法》評分">依《高級中等以下學校特殊教育課程教材教法及評量實施辦法》評分</option>
                        <option value="其他方式">其他方式</option>
                    </select>
                    <input type="text" id="eval_other" style="display: none;" class="mt-2" placeholder="請填寫其他評量方式說明...">
                </td>
            </tr>

            <!-- 4. 期末評量結果 -->
            <tr>
                <th colspan="4" class="text-left bg-gray-100 p-2 font-bold">4. 期末評量結果</th>
            </tr>
            <tr>
                <td colspan="4">
                    <select>
                        <option value="" disabled selected>請選擇評量結果...</option>
                        <option value="通過">通過</option>
                        <option value="不通過">不通過</option>
                        <option value="補考後通過">補考後通過</option>
                        <option value="補考後不通過">補考後不通過</option>
                    </select>
                </td>
            </tr>

            <!-- 簽名欄位 -->
            <tr>
                <th colspan="2" class="text-right align-middle py-6">任課教師簽名：</th>
                <td colspan="2" class="align-middle">
                    <!-- 列印時供手寫的留白，網頁上可輸入 -->
                    <input type="text" placeholder="列印後簽名或輸入姓名" class="w-2/3 border-b-2 border-gray-400 bg-transparent rounded-none focus:border-blue-500 text-center text-lg">
                </td>
            </tr>
        </table>
        
        <div class="mt-8 text-center print-hide">
            <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition transform hover:-translate-y-1">
                🖨️ 填寫完成，列印成 PDF
            </button>
            <p class="text-sm text-gray-500 mt-3">提示：建議使用 Chrome 或 Edge 瀏覽器，列印時可選擇「另存為 PDF」。</p>
        </div>

    </div>

    <script>
        // 1. 學生與班級連動邏輯
        function updateClass(studentName) {
            const classMap = {
                '林崴樂': '1002',
                '黃博裕': '1003',
                '張錦鳳': '1101',
                '陳岷宜': '1201'
            };
            const classInput = document.getElementById('student_class');
            classInput.value = studentName ? (classMap[studentName] || '') : '';
        }

        // 2. 列印前處理：如果下拉選單尚未選擇任何選項，則在列印時隱藏預設的「請選擇...」文字
        window.addEventListener('beforeprint', () => {
            document.querySelectorAll('select').forEach(select => {
                if (select.value === '') {
                    select.classList.add('print-transparent');
                }
            });
        });
        window.addEventListener('afterprint', () => {
            document.querySelectorAll('select').forEach(select => {
                select.classList.remove('print-transparent');
            });
        });
    </script>
</body>
</html>
